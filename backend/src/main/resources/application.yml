server:
  port: 8080
  # X-Forwarded-For 같은 프록시 헤더를 믿지 않는다. 측정 모드는 실제 접속 주소로 같은 컴퓨터인지 판단하는데,
  # 헤더는 누구나 조작할 수 있기 때문이다. 클라우드 환경을 감지해도 자동으로 켜지지 않게 명시한다(AC-9.8).
  forward-headers-strategy: none
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true   # 요청/응답 인코딩을 무조건 UTF-8로 강제 (이 컴퓨터의 기본 인코딩이 MS949라 안전장치로 추가)

gemini:
  # 실제 키 값은 여기 적지 않는다. 환경변수 GEMINI_API_KEY에서 읽어온다.
  # (보안 프로젝트에서 키를 파일에 그대로 적으면 안 된다 - 3단계 완료 기준에 명시된 부분)
  api-key: ${GEMINI_API_KEY}
  model: gemini-3.6-flash
  base-url: https://generativelanguage.googleapis.com/v1beta/models

# 게이트웨이 설정
gateway:
  max-prompt-length: 4000      # 명단과 설정 파일을 붙여넣는 업무 문장이 길다(명세 v2 S1)
  measurement-mode: false      # 개발용. true이면 같은 컴퓨터에서 온 요청에만 외부 AI를 부르지 않고 탐지 결과를 200으로 돌려준다(AC-9.2, 9.3). 사용자에게 노출하는 환경에서는 켜지 않는다.

# 탐지 설정 (docs/design.md 6장). 대량 기준은 측정 전에 동결한다.
detection:
  bulk-threshold: 20

# 가상 회사 사전(코드명, 고객사, 등급 표시, 허용 목록). company 아래 값을 CompanyProperties로 읽는다.
spring:
  config:
    import: classpath:company/dictionary.yml
